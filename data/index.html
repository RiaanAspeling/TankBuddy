<!DOCTYPE html>
<html>
<head>
    <title>DASHBOARD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body>
    <div class="content">
        <div class="card-grid">
            <div class="card">
                <div class="card-header">
                    <p class="card-title">Water Level</p>
                </div>
                <div id="gauge-container">
                    <canvas id="gauge-waterlevel" width="200" height="400"></canvas>
                    <div class="gauge-value" id="water-level-value"></div>
                </div>
                <div class="card-footer">
                    <span class="version-info"><a href="./update">Version %FIRMWARE_VERSION%</a></span>
                </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
